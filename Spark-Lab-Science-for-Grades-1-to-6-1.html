`0.0|Plants are living things that make their own food. A plant uses sunlight, water from the soil and air to grow. The roots take in water, the stem carries it upward, and the leaves catch sunlight. Without light, water or air, a plant becomes weak and may die. That is why we water plants and keep them where light can reach them.
0.1|When you stir sugar into water, the tiny sugar pieces spread out so evenly that you can no longer see them. We say the sugar dissolves, and the mixture is called a solution. The sugar is still there, because the water tastes sweet. Some things, like sand, do not dissolve. They stay as small bits that sink to the bottom.
0.2|A force is a push or a pull. A force can make something start moving, stop moving, speed up, slow down or change direction. A bigger push makes a ball roll farther. Kicking a ball is a push, and opening a drawer by its handle is a pull. Forces are all around us, even when nothing seems to be moving.
0.3|Earth spins like a top, and one full spin takes about 24 hours. The side facing the Sun has day, and the side facing away has night. The Sun does not travel across the sky. It only seems to, because Earth is turning. Sunrise and sunset happen as our part of Earth turns toward or away from the Sun.
1.0|A habitat is the place where an animal finds food, water, shelter and space. Different habitats have different conditions. Fish live in water and breathe with gills. Camels live in deserts and can go a long time without drinking. Penguins live in cold places and have thick feathers and a layer of fat to stay warm. Each animal has body parts that help it live in its own habitat.
1.1|Matter is anything that takes up space and has mass. It usually comes in three states. A solid keeps its own shape. A liquid takes the shape of its container and can flow. A gas spreads out to fill the space it is in. Heating melts ice into water, and more heat turns water into steam, which is water vapor. Cooling reverses these changes.
1.2|Whether something floats depends on how much matter is packed into its size, not just how heavy it feels. A huge ship floats because its shape holds a lot of air, so it is not very dense overall. A small pebble sinks because it is dense. A ball of foil sinks, but the same foil folded into a boat shape can float.
1.3|Weather is what the air outside is like right now: sunny, cloudy, rainy, windy or snowy. It can change from hour to hour. A thermometer measures temperature, a wind vane shows wind direction and a rain gauge measures rain. Writing down the weather each day helps us notice patterns, such as which months are rainy.
2.0|A life cycle is the series of changes a living thing goes through as it grows and has young of its own. A butterfly has four stages: egg, larva (the caterpillar), pupa (the chrysalis) and adult. The caterpillar eats leaves and grows, then changes inside the chrysalis into a butterfly. A frog has a different cycle: egg, tadpole, froglet and adult frog.
2.1|When baking soda and vinegar are mixed, they react and make a new gas called carbon dioxide. The bubbles you see are that gas. Making a new substance is the sign of a chemical change. Other signs are a change in temperature, a change in color or a new smell. Mixing sand and water is different, because no new substance is made.
2.2|A magnet has two ends called poles, a north pole and a south pole. Opposite poles attract each other and like poles push apart. Magnets attract some metals, such as iron, nickel and cobalt, but not wood, plastic or glass. The magnetic force works through air and even through thin paper. A magnet is strongest at its poles.
2.3|Rocks are made of one or more minerals. Over a very long time, wind, water and ice break rocks into smaller pieces. This is called weathering. The pieces mix with dead leaves and tiny living things to make soil. Soil has layers. Topsoil is rich in nutrients and is where most plant roots grow. Below it are subsoil and then solid rock.
3.0|A food chain shows how energy passes from one living thing to another. It starts with the Sun. Producers, such as grass, make food using sunlight. Consumers eat other living things: herbivores eat plants, carnivores eat animals and omnivores eat both. Decomposers, such as fungi and bacteria, break down dead plants and animals and return nutrients to the soil. In grass, rabbit, fox, the arrows show the direction the energy flows.
3.1|Acids taste sour, like lemon juice and vinegar. Bases feel slippery and taste bitter, like soap. Scientists use the pH scale from 0 to 14: below 7 is acidic, 7 is neutral like pure water, and above 7 is basic. Indicators, such as red cabbage juice, change color to show which one a liquid is. Never taste unknown liquids.
3.2|Light travels in straight lines, which is why shadows have clear edges. Sound is made by vibrations that travel as waves through air, water or solids. Sound cannot travel through empty space, but light can. Light is much faster than sound, which is why we see lightning before we hear the thunder.
3.3|The water cycle is the never-ending journey of water around Earth. The Sun heats oceans, lakes and rivers, and some water evaporates into an invisible gas called water vapor. High in the cold air, the vapor condenses into tiny droplets that gather as clouds. When the droplets grow heavy, they fall as precipitation: rain, snow, sleet or hail. The water collects in rivers, lakes, oceans and underground, and the cycle begins again.
4.0|Your body is organized into systems that work together. The digestive system breaks food down so the body can use its nutrients. The respiratory system brings in oxygen and removes carbon dioxide. The circulatory system, with the heart pumping blood through vessels, delivers oxygen and nutrients to every cell. The nervous system, led by the brain, sends signals. The skeletal and muscular systems support the body and move it.
4.1|A mixture is two or more substances that are together but not chemically joined, so each keeps its own properties. Mixtures can be separated by physical methods. Filtering separates sand from water. Evaporation leaves salt behind when the water dries up. A magnet can pull iron out of a mixture. A solution is a mixture in which one substance is evenly dissolved in another.
4.2|Gravity is a force that pulls objects toward each other. Because Earth is so massive, it pulls everything toward its center, which gives things weight. Friction is a force that resists sliding between surfaces that touch. Rough surfaces make more friction than smooth ones. Friction turns some movement energy into heat, which is why rubbing your hands together warms them.
4.3|The solar system is the Sun and everything that travels around it. The eight planets, in order from the Sun, are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. The first four are small and rocky. Jupiter and Saturn are gas giants, and Uranus and Neptune are ice giants. A planet’s year is the time it takes to orbit the Sun: Earth takes about 365 days, and Neptune takes about 165 Earth years.
5.0|Cells are the basic units of life. Some living things, like bacteria, have just one cell, while people have trillions. Most cells have a cell membrane that controls what goes in and out, a nucleus that holds DNA and acts as the control center, cytoplasm where chemical reactions happen, and mitochondria that release energy from food. Plant cells also have a rigid cell wall and chloroplasts, where photosynthesis happens.
5.1|Everything around you is made of atoms. An atom has a tiny nucleus in the center, made of positively charged protons and neutral neutrons, with negatively charged electrons moving around it. The number of protons decides which element an atom is. Hydrogen has 1 proton, carbon has 6 and oxygen has 8. An element is a substance made of only one kind of atom.
5.2|Electric current is the flow of electric charge, carried by electrons moving through a wire. A circuit needs a source such as a battery, a conductor such as copper wire and a load such as a bulb, joined in a closed loop. If the loop is broken, for example by an open switch, the current stops. Metals are conductors, and rubber and plastic are insulators.
5.3|Earth’s hard outer shell is broken into huge pieces called tectonic plates. They move very slowly, only a few centimeters each year, about as fast as fingernails grow. Where plates collide, pull apart or slide past each other, we find earthquakes, volcanoes and mountain building. The Himalayas are rising because the Indian Plate is pushing into the Eurasian Plate. Many volcanoes lie along the Ring of Fire around the Pacific Ocean.
5.7|Earth has four main layers. The crust is the thin, solid outer skin, about 5 to 70 km thick, and it is where we live. Below it, the mantle is about 2,900 km thick and is made of hot rock that flows very slowly. The outer core is liquid iron and nickel, about 2,200 km thick. At the center, the inner core is a solid ball of iron and nickel with a radius of about 1,220 km. It is extremely hot, around 5,000°C or more, but huge pressure keeps it solid.
5.9|The periodic table organizes all 118 known elements in order of atomic number, which is the number of protons in each atom. Each row is called a period and each column is called a group. Elements in the same group behave in similar ways. Metals fill the left and middle, nonmetals sit on the right, and metalloids lie along the staircase line between them. Hydrogen is a nonmetal even though it sits at the top left. Group 18 holds the noble gases, which rarely react. The colors show the families of elements.`

try{const s=JSON.parse(localStorage.getItem("sparklab5")||"null");if(s){D.h=s.h||D.h;if(s.t&&s.t.length==6)D.t=s.t;if(s.f&&s.f.length)D.f=s.f}}catch(e){}
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const save=()=>{try{localStorage.setItem("sparklab5",JSON.stringify({h:D.h,t:D.t,f:D.f}))}catch(e){}};
let deck=[],by={},sub="all",g="all",qi=0,sc=0,fi=0,ed=false;
function applyEdit(){document.querySelectorAll("[data-k]").forEach(e=>{e.contentEditable=ed?"true":"false"});$("reset").hidden=!ed}
function render(k){
  const A=g=="all",gs=A?[0,1,2,3,4,5]:[g];let c=0;
  document.documentElement.style.setProperty("--c","var(--g"+(A?3:g+1)+")");
  $("topics").innerHTML=gs.map(gi=>D.t[gi].map((x,n)=>{if(sub!="all"&&x[4]!=sub)return"";c++;return `<article class="card${gi==5&&n==9?" wide":""}" style="--c:var(--g${gi+1})"><div class="band"><span class="ic" aria-hidden="true">${x[0]}</span><h3 data-k="t.${gi}.${n}.1">${esc(x[1])}</h3></div>${FIG[gi+"."+n]?`<div class="fig">${FIG[gi+"."+n]()}</div>`:pic(gi,n)}<div class="body"><span class="chip">${S[x[4]]}</span> ${A?`<span class="chip">Grade ${gi+1}</span>`:""}<p data-k="t.${gi}.${n}.2">${esc(x[2])}</p>${x[3]?`<button class="try" aria-expanded="false">📖 Read the full lesson</button><p class="act" data-k="t.${gi}.${n}.3">${esc(x[3])}</p>`:""}<a class="vid" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x[1]+" science for kids")}">▶ Find a video</a></div></article>`}).join("")).join("");
  $("gh").textContent=(A?"All grades":"Grade "+(g+1))+": "+c+" lessons"+(sub=="all"?"":" in "+S[sub].split(" ").slice(1).join(" "));
  document.querySelectorAll(".gb").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g==String(g)));
  document.querySelectorAll(".sb").forEach(b=>{const k=b.dataset.s,m=gs.reduce((t,gi)=>t+D.t[gi].filter(x=>k=="all"||x[4]==k).length,0);b.textContent=b.dataset.l+" ("+m+")";b.setAttribute("aria-pressed",k==sub)});
  if(!k){deal();showQ()}applyEdit();
}
function pic(g,n){const p=(I[g]||[])[n];if(!p)return"";const c=p[0],a=p.slice(1).split("|").filter(Boolean),m=a.length;
  return `<div class="pic" role="img" aria-label="Diagram: ${esc(a.join(", "))}">`+a.map((t,i)=>{const k=t.indexOf(" ");return (i?`<span class="cn" aria-hidden="true">${c==">"?"→":c=="+"?(i==m-1?"=":"+"):""}</span>`:"")+`<figure aria-hidden="true"${c==">"?` style="animation:pl ${m}s ${i}s infinite"`:""}><span class="em">${t.slice(0,k)}</span><figcaption>${esc(t.slice(k+1))}</figcaption></figure>`}).join("")+"</div>"}
function deal(){const r=()=>Math.random()-.5;deck=(g=="all"?Q.flat():Q[g]).map(x=>{const o=x.o.map((t,i)=>[t,i==x.a]).sort(r);return{s:x.s,q:x.q,o:o.map(v=>v[0]),a:o.findIndex(v=>v[1])}}).sort(r).slice(0,10);qi=0;sc=0;by={}}
function showQ(){
  const b=$("qbox"),n=deck.length;
  if(qi>=n){const r=sc>=9?"🏆 Super Scientist":sc>=7?"🥇 Lab Expert":sc>=5?"🔭 Explorer":"🌱 Rising Scientist";
    b.innerHTML=`<p class="res">${sc} / ${n}</p><p class="rk">${r} (${Math.round(sc/n*100)}%)</p><p aria-hidden="true">${"⭐".repeat(Math.ceil(sc/2))}</p><div class="by">${Object.keys(S).map(k=>`<span class="chip">${S[k]}: ${(by[k]||[0,0])[0]} of ${(by[k]||[0,0])[1]}</span>`).join("")}</div><p>${sc==n?"Perfect score! Amazing work!":"Read the topics above, then play again to beat your score."}</p><button class="btn" id="again">Play again</button>`;return}
  const q=deck[qi];
  b.innerHTML=`<div class="bar" role="progressbar" aria-valuenow="${qi}" aria-valuemin="0" aria-valuemax="${n}"><i style="width:${qi/n*100}%"></i></div><p class="qq">Question ${qi+1} of ${n}, ${S[q.s]}. Score: ${sc}</p><h3>${q.q}</h3><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div><p id="fb" role="status"></p>`;
}
$("qbox").addEventListener("click",e=>{
  const t=e.target;
  if(t.id=="again"){deal();showQ();return}
  if(t.id=="next"){qi++;showQ();return}
  if(!t.classList.contains("opt"))return;
  const q=deck[qi],i=+t.dataset.i,ok=i==q.a,r=by[q.s]=by[q.s]||[0,0];r[1]++;
  document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i==q.a)o.classList.add("ok")});
  if(ok){sc++;r[0]++}else t.classList.add("no");
  $("fb").innerHTML=(ok?"Correct! 🎉 +1 point":"Not quite. The answer is "+q.o[q.a]+".")+` <button class="btn" id="next">${qi+1<n()?"Next question":"See my score"}</button>`;
  $("next").focus();
});
function n(){return deck.length}
$("topics").addEventListener("click",e=>{
  const b=e.target.closest(".try");if(!b)return;
  const a=b.nextElementSibling,on=a.classList.toggle("on");
  b.setAttribute("aria-expanded",on);b.textContent=on?"Hide lesson":"📖 Read the full lesson";
});
$("grades").innerHTML=[0,1,2,3,4,5].map(i=>`<button class="gb" style="--c:var(--g${i+1})" data-g="${i}">Grade ${i+1}</button>`).join("")+`<button class="gb" style="--c:linear-gradient(90deg,var(--g1),var(--g3),var(--g4),var(--g6))" data-g="all">All grades</button>`;
$("grades").addEventListener("click",e=>{const b=e.target.closest(".gb");if(b){g=b.dataset.g=="all"?"all":+b.dataset.g;render()}});
const S={bio:"🧬 Biology",chem:"⚗️ Chemistry",phy:"⚡ Physics",earth:"🌍 Earth Science"};
$("subs").innerHTML=[["all","🔭 All science"],...Object.entries(S)].map(([k,v])=>`<button class="sb" data-l="${v}" data-s="${k}">${v}</button>`).join("");
$("subs").addEventListener("click",e=>{const b=e.target.closest(".sb");if(b){sub=b.dataset.s;render(1)}});
function showF(){const e=$("fact");e.dataset.k="f."+fi;e.textContent=D.f[fi];applyEdit()}
$("more").onclick=()=>{fi=(fi+1+Math.floor(Math.random()*(D.f.length-1)))%D.f.length;showF()};
$("edit").onclick=()=>{ed=!ed;document.body.classList.toggle("editing",ed);$("edit").textContent=ed?"Done editing":"Edit page";$("edit").setAttribute("aria-pressed",ed);applyEdit()};
$("reset").onclick=()=>{try{localStorage.removeItem("sparklab5")}catch(e){}location.reload()};
document.addEventListener("input",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  const a=k.split(".");let o=D;for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=e.target.textContent;save();
});
document.addEventListener("paste",e=>{if(e.target.dataset&&e.target.dataset.k){e.preventDefault();document.execCommand("insertText",false,e.clipboardData.getData("text/plain"))}});
document.querySelectorAll(".goq").forEach(b=>b.onclick=()=>$("quiz").scrollIntoView({behavior:"smooth"}));
$("ht").textContent=D.h.title;$("hs").textContent=D.h.sub;
fi=Math.floor(Math.random()*D.f.length);showF();render();
</script>
</body>
</html>
